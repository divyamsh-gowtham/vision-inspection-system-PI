<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ProInspect &middot; Select recipe</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
<style>
  .work{
    position:relative;z-index:1;flex:1;min-height:0;
    display:grid;grid-template-columns:320px 1fr;gap:16px;padding:20px 24px;
  }
  .panel{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--sh-1);display:flex;flex-direction:column;min-height:0;overflow:hidden;
  }
  .panel > h2{
    flex:0 0 auto;padding:15px 18px;border-bottom:1px solid var(--line-soft);
    font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.17em;
    text-transform:uppercase;color:var(--ink-dim);
  }
  .scroll{flex:1;min-height:0;overflow-y:auto}

  /* ---------- selected product, as context ---------- */
  .shot{
    height:200px;background:#fff;overflow:hidden;
    border-bottom:1px solid var(--line-soft);position:relative;
  }
  .shot img{
    position:absolute;inset:16px;
    width:calc(100% - 32px);height:calc(100% - 32px);
    object-fit:contain;display:block;
  }
  .pinfo{padding:16px 18px}
  .pinfo .nm{font-size:17px;font-weight:600;letter-spacing:-.3px;line-height:1.2}
  .pinfo .pk{font-size:12.5px;color:var(--ink-dim);margin-top:5px}
  .kv{margin-top:14px;display:grid;gap:9px}
  .kv div{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .kv dt{
    font-family:var(--mono);font-size:9px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--ink-dim);
  }
  .kv dd{font-family:var(--mono);font-size:11.5px;text-align:right}

  /* ---------- recipe cards ---------- */
  .recipes{padding:16px 18px;display:grid;gap:12px;align-content:start}
  .rcp{
    border:1px solid var(--line);border-radius:13px;padding:17px 19px;
    background:linear-gradient(180deg,#fff,#FBFCFD);cursor:pointer;
    transition:border-color .13s ease, background .13s ease;
  }
  .rcp:hover{border-color:#9FB9CB;background:#F7FAFC}
  .rcp.sel{border-color:var(--live);background:#F2F8FB;box-shadow:inset 0 0 0 1px var(--live)}
  .rcp .top{display:flex;align-items:flex-start;gap:12px}
  .rcp .nm{font-size:16px;font-weight:600;letter-spacing:-.25px;flex:1}
  .rcp .id{font-family:var(--mono);font-size:10.5px;color:var(--ink-dim)}
  .pill{
    font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.13em;
    text-transform:uppercase;padding:4px 8px;border-radius:6px;white-space:nowrap;
  }
  .pill.def{background:var(--ok-soft);color:var(--ok)}
  /* The code as the printer lays it down - the operator matches this by eye. */
  .sample{
    margin-top:13px;padding:12px 14px;border-radius:9px;
    background:#0F1E29;color:#CFE6F2;
    font-family:var(--mono);font-size:14px;line-height:1.5;white-space:pre;
    letter-spacing:.06em;overflow-x:auto;
  }
  .facts{
    margin-top:13px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
    border-top:1px solid var(--line-soft);padding-top:12px;
  }
  .facts div dt{
    font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-dim);
  }
  .facts div dd{
    font-family:var(--mono);font-size:12.5px;margin-top:4px;
    font-variant-numeric:tabular-nums;
  }
  .empty{flex:1;display:grid;place-items:center;text-align:center;
    color:var(--ink-dim);font-size:13.5px;padding:40px}

  .actionbar{
    flex:0 0 auto;display:flex;align-items:center;gap:18px;
    padding:13px 24px;background:var(--card);border-top:1px solid var(--line);
    position:relative;z-index:2;
  }
  .summary{flex:1;min-width:0}
  .summary .l{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;
    text-transform:uppercase;color:var(--ink-dim);
  }
  .summary .v{font-size:14px;font-weight:600;margin-top:3px;letter-spacing:-.2px}
  .summary .v.none{color:var(--ink-dim);font-weight:400}
</style>
</head>
<body>

<div class="topbar">
  <a class="backbtn" href="products.html">
    <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Product
  </a>
  <div class="rule"></div>
  <div class="station">
    <div class="t">Inspection Dashboard</div>
    <div class="s">Step 2 of 2 &middot; recipe</div>
  </div>
  <div class="spacer"></div>
  <div class="brand">
    <img class="logo" id="logo" src="logo-icon.png" alt="">
    <div class="wm">Pro<span>Inspect</span></div>
  </div>
  <div class="rule"></div>
  <div class="clock"><div class="hm" id="hm">--:--</div><div class="dt" id="dt">&mdash;</div></div>
  <div class="iconbtn pwr" data-power tabindex="0" role="button" aria-label="Power">
    <svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
  </div>
</div>

<div class="work">
  <div class="panel">
    <h2>Product</h2>
    <div class="scroll" id="prodPane"></div>
  </div>
  <div class="panel">
    <h2>Recipe</h2>
    <div class="scroll" id="rcpPane"></div>
  </div>
</div>

<div class="actionbar">
  <div class="summary">
    <div class="l">Selected</div>
    <div class="v none" id="sumText">No recipe selected</div>
  </div>
  <button class="btn" id="btnBack">Back</button>
  <button class="btn primary lg" id="btnLoad" disabled>Load recipe &amp; start</button>
</div>

<div class="botbar">
  <span class="st warn"><span class="d"></span>Camera idle</span>
  <span class="st off"><span class="d"></span>Dashboard offline</span>
  <span class="unit" id="unit">&mdash;</span>
  <span class="spacer"></span>
  <span class="by">ProInspect Systems &middot; <span id="ver">v0.1.0</span></span>
</div>

<script src="app.js"></script>
<script>
(function(){
  'use strict';
  var prod = null, selRcp = null;

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];
    });
  }
  function param(n){
    var m = new RegExp('[?&]'+n+'=([^&]*)').exec(location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }
  function kv(k,v){ return '<div><dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd></div>'; }
  function fact(k,v){ return '<div><dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd></div>'; }

  function renderProduct(){
    document.getElementById('prodPane').innerHTML =
      '<div class="shot"><img src="'+esc(prod.image)+'" alt="'+esc(prod.name)+'"></div>' +
      '<div class="pinfo">' +
        '<div class="nm">'+esc(prod.name)+'</div>' +
        '<div class="pk">'+esc(prod.pack)+'</div>' +
        '<div class="kv">' +
          kv('SKU', prod.sku) + kv('Product', prod.id) +
          kv('Substrate', prod.substrate) + kv('Code at', prod.code_location) +
        '</div></div>';
  }

  function renderRecipes(){
    var pane = document.getElementById('rcpPane');
    pane.innerHTML = '<div class="recipes">' + prod.recipes.map(function(r){
      return '<div class="rcp'+(selRcp && r.id===selRcp.id?' sel':'')+'" tabindex="0" data-rid="'+esc(r.id)+'">' +
        '<div class="top"><div class="nm">'+esc(r.name)+'</div>' +
        (r.default ? '<span class="pill def">Default</span>' : '') +
        '<span class="id">'+esc(r.id)+'</span></div>' +
        '<div class="sample">'+esc(r.sample)+'</div>' +
        '<div class="facts">' +
          fact('Printer', r.printer || '—') +
          fact('Lines', r.lines != null ? r.lines : '—') +
          fact('Char height', r.char_height_mm != null ? r.char_height_mm + ' mm' : '—') +
          fact('Last run', r.last_run || '—') +
        '</div></div>';
    }).join('') + '</div>';

    pane.querySelectorAll('.rcp').forEach(function(el){
      function pick(){
        selRcp = prod.recipes.filter(function(r){ return r.id === el.dataset.rid; })[0];
        pane.querySelectorAll('.rcp').forEach(function(x){ x.classList.remove('sel'); });
        el.classList.add('sel');
        updateSummary();
      }
      el.addEventListener('click', pick);
      el.addEventListener('keydown', function(e){
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); }
      });
    });
  }

  function updateSummary(){
    var t = document.getElementById('sumText'), b = document.getElementById('btnLoad');
    if (selRcp){
      t.textContent = prod.name + '  —  ' + selRcp.name + '  (' + selRcp.id + ')';
      t.classList.remove('none'); b.disabled = false;
    } else {
      t.textContent = 'No recipe selected'; t.classList.add('none'); b.disabled = true;
    }
  }

  document.getElementById('btnBack').addEventListener('click', function(){
    location.href = 'products.html';
  });
  document.getElementById('btnLoad').addEventListener('click', function(){
    if (!selRcp) return;
    location.href = 'run.html?product=' + encodeURIComponent(prod.id) +
                    '&recipe=' + encodeURIComponent(selRcp.id);
  });
  fetch('data/products.json')
    .then(function(r){ return r.json(); })
    .then(function(d){
      var want = param('product');
      var list = d.products || [];
      prod = list.filter(function(p){ return p.id === want; })[0] || list[0];
      if (!prod){
        document.getElementById('rcpPane').innerHTML =
          '<div class="empty">That product is not in the catalogue.</div>';
        return;
      }
      renderProduct();
      // Pre-pick the default recipe: at a changeover that is nearly always the
      // right one, and it saves the operator a decision.
      selRcp = prod.recipes.filter(function(r){ return r.default; })[0] || prod.recipes[0] || null;
      renderRecipes(); updateSummary();
    })
    .catch(function(e){
      document.getElementById('rcpPane').innerHTML =
        '<div class="empty">Could not load the catalogue.<br>'+esc(e.message)+'</div>';
    });
})();
</script>
</body>
</html>
